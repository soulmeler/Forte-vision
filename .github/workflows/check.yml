name: Code checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            desktop/package-lock.json
      - run: npm run setup
      - run: npm run scan:secrets
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
